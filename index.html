<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چت آنلاین</title>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root{
    --bg1:#0f0c29;
    --bg2:#302b63;
    --bg3:#24243e;
    --accent:#7f5af0;
    --accent2:#2cb67d;
    --card:#1e1b3a;
    --text:#e6e6f0;
    --muted:#9a97b3;
    --bubble-me: linear-gradient(135deg,#7f5af0,#5e3fd6);
    --bubble-other:#2a2750;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
    color:var(--text);
  }

  /* ---------- Login Screen ---------- */
  #loginScreen{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-card{
    background:rgba(30,27,58,0.85);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:40px 32px;
    width:100%;
    max-width:380px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .login-card h1{
    font-size:26px;
    margin-bottom:8px;
    background: linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .login-card p{
    color:var(--muted);
    margin-bottom:24px;
    font-size:14px;
  }
  .login-card input{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);
    color:var(--text);
    font-size:15px;
    outline:none;
    margin-bottom:16px;
    transition:.2s;
  }
  .login-card input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(127,90,240,0.25);
  }
  .login-card button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),#5e3fd6);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .login-card button:hover{ opacity:.9; transform:translateY(-1px); }
  .login-error{ color:#ff6b6b; font-size:13px; margin-top:10px; min-height:16px; }

  /* ---------- Chat Screen ---------- */
  #chatScreen{
    display:none;
    height:100%;
    flex-direction:column;
  }
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
    background:rgba(20,18,40,0.7);
    border-bottom:1px solid rgba(255,255,255,0.07);
    flex-wrap:wrap;
    gap:10px;
  }
  header.topbar .brand{
    font-weight:700;
    font-size:17px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header.topbar .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 8px var(--accent2);
  }
  #onlineList{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .user-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.06);
    padding:6px 10px 6px 6px;
    border-radius:999px;
    font-size:13px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .avatar{
    width:24px;height:24px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
    color:#fff;
    flex-shrink:0;
  }
  .avatar.big{ width:36px;height:36px;font-size:15px; }
  .status-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 6px var(--accent2);
  }

  main.chat-area{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg-row{
    display:flex;
    gap:10px;
    max-width:70%;
    align-items:flex-end;
  }
  .msg-row.me{
    align-self:flex-start;
    flex-direction:row-reverse;
  }
  .msg-row.other{
    align-self:flex-end;
  }
  .msg-bubble{
    padding:10px 14px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.6;
    word-wrap:break-word;
    position:relative;
  }
  .msg-row.me .msg-bubble{
    background:var(--bubble-me);
    color:#fff;
    border-bottom-left-radius:4px;
  }
  .msg-row.other .msg-bubble{
    background:var(--bubble-other);
    border-bottom-right-radius:4px;
  }
  .msg-meta{
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
    display:flex;
    gap:6px;
  }
  .msg-row.me .msg-meta{ justify-content:flex-end; }

  footer.composer{
    display:flex;
    gap:10px;
    padding:16px 20px;
    background:rgba(20,18,40,0.7);
    border-top:1px solid rgba(255,255,255,0.07);
  }
  footer.composer input{
    flex:1;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.05);
    color:var(--text);
    font-size:14.5px;
    outline:none;
  }
  footer.composer input:focus{
    border-color:var(--accent);
  }
  footer.composer button{
    padding:0 22px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),#5e3fd6);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    font-size:14.5px;
  }
  footer.composer button:disabled{ opacity:.5; cursor:not-allowed; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.15); border-radius:10px; }
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <h1>💬 چت‌روم</h1>
    <p>یک اسم برای خودت انتخاب کن و وارد چت شو</p>
    <input id="nameInput" type="text" placeholder="اسمت رو بنویس..." maxlength="20" autocomplete="off">
    <button id="joinBtn">ورود به چت</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ============ CHAT SCREEN ============ -->
<div id="chatScreen">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> چت‌روم زنده</div>
    <div id="onlineList"></div>
  </header>

  <main class="chat-area" id="chatArea"></main>

  <footer class="composer">
    <input id="msgInput" type="text" placeholder="پیامت رو بنویس..." autocomplete="off">
    <button id="sendBtn">ارسال</button>
  </footer>
</div>

<script>
/* =======================================================================
   1) پیکربندی Supabase — این دو مقدار رو با تنظیمات پروژه خودت جایگزین کن
   ======================================================================= */
const SUPABASE_URL = "https://uukodwdxrckhpqgrtiir.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8zXNILcWmGFXOGZ5F6SgvA_Z7rYWfCA";

const isConfigured = !SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_ANON_KEY.startsWith("YOUR_");
const supabaseClient = isConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* =======================================================================
   2) متغیرهای عمومی
   ======================================================================= */
const MAX_MESSAGES = 200;
const ROOM = "main-room";
let myName = "";
let presenceChannel = null;
const colors = ["#7f5af0","#2cb67d","#ff6b6b","#f5a623","#4fb0ff","#e356a7","#37c9c1","#c084fc"];

function colorFor(name){
  let hash = 0;
  for (let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return colors[Math.abs(hash) % colors.length];
}
function initials(name){
  return name.trim().charAt(0).toUpperCase();
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}
function formatTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
}

/* =======================================================================
   3) ورود کاربر
   ======================================================================= */
const loginScreen = document.getElementById('loginScreen');
const chatScreen = document.getElementById('chatScreen');
const nameInput = document.getElementById('nameInput');
const joinBtn = document.getElementById('joinBtn');
const loginError = document.getElementById('loginError');

joinBtn.addEventListener('click', joinChat);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinChat(); });

function joinChat(){
  if (!isConfigured){
    loginError.textContent = "ابتدا تنظیمات Supabase را در فایل انجام بده.";
    return;
  }
  const name = nameInput.value.trim();
  if (!name){
    loginError.textContent = "لطفاً یک اسم وارد کن.";
    return;
  }
  loginError.textContent = "";
  myName = name;

  const userKey = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2);

  presenceChannel = supabaseClient.channel(ROOM, { config: { presence: { key: userKey } } });

  presenceChannel
    .on('presence', { event: 'sync' }, () => updateOnlineList())
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED'){
        // اگر هیچ‌کس آنلاین نیست، یعنی چت‌روم خالی بوده -> پیام‌های قبلی پاک شود
        const state = presenceChannel.presenceState();
        const currentCount = Object.keys(state).length;
        if (currentCount === 0){
          await supabaseClient.from('messages').delete().gt('id', 0);
        }
        await presenceChannel.track({ name: myName });
        startChat();
      }
    });
}

/* =======================================================================
   4) شروع چت
   ======================================================================= */
const onlineList = document.getElementById('onlineList');
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

async function startChat(){
  loginScreen.style.display = 'none';
  chatScreen.style.display = 'flex';

  // بارگذاری پیام‌های موجود
  const { data: existing } = await supabaseClient
    .from('messages')
    .select('*')
    .order('created_at', { ascending: true });

  chatArea.innerHTML = '';
  (existing || []).forEach(renderMessage);
  chatArea.scrollTop = chatArea.scrollHeight;

  // گوش دادن زنده به پیام‌های جدید و حذف‌شده
  supabaseClient.channel('messages-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      renderMessage(payload.new);
      chatArea.scrollTop = chatArea.scrollHeight;
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
      const el = chatArea.querySelector(`[data-id="${payload.old.id}"]`);
      if (el) el.remove();
    })
    .subscribe();

  // وقتی کاربر تب/صفحه را می‌بندد
  window.addEventListener('beforeunload', () => {
    if (presenceChannel) presenceChannel.untrack();
  });
}

function updateOnlineList(){
  const state = presenceChannel.presenceState();
  onlineList.innerHTML = '';
  Object.values(state).forEach(presences => {
    presences.forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'user-chip';
      chip.innerHTML = `
        <span class="avatar" style="background:${colorFor(p.name)}">${initials(p.name)}</span>
        <span>${escapeHtml(p.name)}</span>
        <span class="status-dot"></span>
      `;
      onlineList.appendChild(chip);
    });
  });
}

function renderMessage(msg){
  const row = document.createElement('div');
  const mine = msg.name === myName;
  row.className = 'msg-row ' + (mine ? 'me' : 'other');
  row.dataset.id = msg.id;
  row.innerHTML = `
    <span class="avatar" style="background:${colorFor(msg.name)}">${initials(msg.name)}</span>
    <div>
      <div class="msg-meta">${!mine ? escapeHtml(msg.name) : ''}<span>${formatTime(msg.created_at)}</span></div>
      <div class="msg-bubble">${escapeHtml(msg.text)}</div>
    </div>
  `;
  chatArea.appendChild(row);
}

/* =======================================================================
   5) ارسال پیام + محدودیت ۲۰۰ پیام
   ======================================================================= */
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

async function sendMessage(){
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';

  await supabaseClient.from('messages').insert({ name: myName, text: text });
  trimOldMessages();
}

async function trimOldMessages(){
  const { data, count } = await supabaseClient
    .from('messages')
    .select('id', { count: 'exact' })
    .order('created_at', { ascending: true });

  if (count && count > MAX_MESSAGES){
    const excess = count - MAX_MESSAGES;
    const idsToDelete = data.slice(0, excess).map(row => row.id);
    if (idsToDelete.length){
      await supabaseClient.from('messages').delete().in('id', idsToDelete);
    }
  }
}
</script>
</body>
</html>
