<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>چت آنلاین</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0c29">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root{
    --bg1:#0f0c29;
    --bg2:#302b63;
    --bg3:#24243e;
    --accent:#7f5af0;
    --accent2:#2cb67d;
    --card:#1e1b3a;
    --text:#e6e6f0;
    --muted:#9a97b3;
    --bubble-me: linear-gradient(135deg,#7f5af0,#5e3fd6);
    --bubble-other:#2a2750;
    --radius:16px;
    --frame:14px;
    --frame-bottom:44px;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    min-height:100dvh;
    margin:0;
    font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
    color:var(--text);
    overflow:hidden;
  }

  /* ---------- Four-edge decorative frame ---------- */
  #pageFrame{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    border:var(--frame) solid transparent;
    border-image: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent)) 1;
    box-shadow:
      inset 0 0 30px rgba(127,90,240,0.25),
      inset 0 0 8px rgba(44,182,125,0.2);
  }
  #app{
    position:fixed;
    top:var(--frame);
    left:var(--frame);
    right:var(--frame);
    bottom:calc(var(--frame-bottom) + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border-radius:10px;
  }

  /* ---------- Login Screen ---------- */
  #loginScreen, #roomsScreen, #roomPasswordScreen{
    height:100%;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow-y:auto;
  }
  .login-card{
    background:rgba(30,27,58,0.85);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:36px 30px;
    width:100%;
    max-width:400px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    margin:auto;
  }
  .login-card h1{
    font-size:24px;
    margin-bottom:6px;
    background: linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .login-card p{
    color:var(--muted);
    margin-bottom:22px;
    font-size:13.5px;
  }
  .login-card input, .login-card select{
    width:100%;
    padding:13px 15px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);
    color:var(--text);
    font-size:14.5px;
    outline:none;
    margin-bottom:12px;
    transition:.2s;
    font-family:inherit;
  }
  .login-card input:focus, .login-card select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(127,90,240,0.25);
  }
  .gender-row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
  }
  .gender-btn{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);
    color:var(--text);
    font-size:14px;
    cursor:pointer;
    transition:.2s;
  }
  .gender-btn.selected{
    background:linear-gradient(135deg,var(--accent),#5e3fd6);
    border-color:transparent;
    font-weight:700;
  }
  .login-card button.submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),#5e3fd6);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    margin-top:6px;
  }
  .login-card button.submit-btn:hover{ opacity:.9; transform:translateY(-1px); }
  .login-error{ color:#ff6b6b; font-size:13px; margin-top:10px; min-height:16px; }

  .install-banner{
    margin-top:18px;
    padding:14px 16px;
    border-radius:14px;
    background:rgba(44,182,125,0.1);
    border:1px solid rgba(44,182,125,0.35);
    text-align:right;
  }
  .install-banner p{
    margin:0 0 8px;
    color:var(--text);
    font-size:12.5px;
    line-height:1.8;
  }
  .install-banner a{
    display:block;
    text-align:center;
    padding:10px;
    border-radius:10px;
    background:linear-gradient(135deg,var(--accent2),#219a68);
    color:#fff;
    font-size:13.5px;
    font-weight:700;
    text-decoration:none;
  }

  .room-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    margin-bottom:10px;
    cursor:pointer;
    transition:.15s;
    text-align:right;
  }
  .room-item:hover{ background:rgba(255,255,255,0.1); }
  .room-item .room-name{
    font-size:14.5px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .room-item .room-lock{ font-size:13px; opacity:.7; }
  .no-rooms-msg{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:20px 0;
  }

  /* ---------- Chat Screen ---------- */
  #chatScreen{
    display:none;
    height:100%;
    width:100%;
    flex-direction:column;
    overflow:hidden;
  }
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 18px;
    background:rgba(20,18,40,0.7);
    border-bottom:1px solid rgba(255,255,255,0.07);
    flex-wrap:wrap;
    gap:8px;
    flex-shrink:0;
  }
  header.topbar .brand{
    font-weight:700;
    font-size:16px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  header.topbar .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 8px var(--accent2);
  }
  #onlineList{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .user-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.06);
    padding:6px 10px 6px 6px;
    border-radius:999px;
    font-size:12.5px;
    border:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
    transition:.15s;
  }
  .user-chip:hover{ background:rgba(255,255,255,0.12); }
  .avatar{
    width:24px;height:24px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
    color:#fff;
    flex-shrink:0;
  }
  .avatar.big{ width:56px;height:56px;font-size:22px; }
  .status-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 6px var(--accent2);
  }

  main.chat-area{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    min-height:0;
  }
  .msg-row{
    display:flex;
    gap:10px;
    max-width:75%;
    align-items:flex-end;
  }
  .msg-row.me{
    align-self:flex-start;
    flex-direction:row-reverse;
  }
  .msg-row.other{
    align-self:flex-end;
  }
  .msg-row .avatar{ cursor:pointer; }
  .msg-bubble{
    padding:10px 14px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.6;
    word-wrap:break-word;
    position:relative;
  }
  .msg-row.me .msg-bubble{
    background:var(--bubble-me);
    color:#fff;
    border-bottom-left-radius:4px;
  }
  .msg-row.other .msg-bubble{
    background:var(--bubble-other);
    border-bottom-right-radius:4px;
  }
  .msg-meta{
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
    display:flex;
    gap:6px;
    cursor:pointer;
  }
  .msg-row.me .msg-meta{ justify-content:flex-end; }

  footer.composer{
    display:flex;
    gap:10px;
    padding:12px 16px;
    background:rgba(20,18,40,0.7);
    border-top:1px solid rgba(255,255,255,0.07);
    flex-shrink:0;
  }
  footer.composer input{
    flex:1;
    padding:13px 15px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.05);
    color:var(--text);
    font-size:14.5px;
    outline:none;
    min-width:0;
  }
  footer.composer input:focus{
    border-color:var(--accent);
  }
  footer.composer button{
    padding:0 20px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),#5e3fd6);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    font-size:14.5px;
    flex-shrink:0;
  }
  footer.composer button:disabled{ opacity:.5; cursor:not-allowed; }

  .mic-btn{
    padding:0 18px !important;
    background:rgba(255,255,255,0.08) !important;
    flex-shrink:0;
    font-size:18px !important;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  .mic-btn.recording{
    background:linear-gradient(135deg,#ff6b6b,#e63946) !important;
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,107,107,0.5); }
    70%{ box-shadow:0 0 0 12px rgba(255,107,107,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,107,107,0); }
  }
  .recording-indicator{
    position:fixed;
    bottom:calc(var(--frame-bottom) + env(safe-area-inset-bottom, 0px) + 70px);
    left:50%;
    transform:translateX(-50%);
    background:rgba(20,18,40,0.95);
    border:1px solid rgba(255,107,107,0.4);
    padding:8px 18px;
    border-radius:999px;
    font-size:13px;
    display:none;
    align-items:center;
    gap:8px;
    z-index:5000;
  }
  .recording-indicator.show{ display:flex; }
  .recording-indicator .rec-dot{
    width:8px;height:8px;border-radius:50%;
    background:#ff6b6b;
    animation:pulse 1.2s infinite;
  }

  .voice-msg{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .voice-msg audio{
    height:34px;
    max-width:200px;
  }

  .img-btn{
    padding:0 16px !important;
    background:rgba(255,255,255,0.08) !important;
    flex-shrink:0;
    font-size:17px !important;
  }
  .msg-bubble img.chat-img{
    max-width:220px;
    max-height:220px;
    border-radius:10px;
    display:block;
    cursor:pointer;
  }
  .lightbox-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    z-index:10001;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .lightbox-overlay.open{ display:flex; }
  .lightbox-overlay img{
    max-width:100%;
    max-height:90vh;
    border-radius:10px;
  }

  /* ---------- Profile Modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:10000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    background:var(--card);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:28px;
    width:100%;
    max-width:320px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-card .avatar.big{ margin:0 auto 14px; }
  .modal-card h2{ margin:0 0 4px; font-size:19px; }
  .modal-card .gender-tag{
    display:inline-block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .modal-info-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
    font-size:14px;
  }
  .modal-info-row:last-of-type{ border-bottom:none; }
  .modal-info-row span:first-child{ color:var(--muted); }
  .modal-close{
    margin-top:18px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:var(--text);
    cursor:pointer;
    font-size:14px;
    font-family:inherit;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.15); border-radius:10px; }
</style>
</head>
<body>

<div id="pageFrame"></div>

<div id="app">

  <!-- ============ ROOMS SCREEN ============ -->
  <div id="roomsScreen">
    <div class="login-card">
      <h1>💬 اتاق‌های چت</h1>
      <p>یک اتاق رو انتخاب کن یا اتاق جدید بساز</p>
      <div id="roomsList"></div>
      <button class="submit-btn" id="showCreateRoomBtn" style="margin-top:14px;">+ ساخت اتاق جدید</button>

      <div id="createRoomForm" style="display:none; margin-top:14px;">
        <input id="roomNameInput" type="text" placeholder="اسم اتاق (انگلیسی)" maxlength="30" autocomplete="off">
        <input id="roomPasswordInput" type="text" placeholder="پسورد (اختیاری)" maxlength="30" autocomplete="off">
        <button class="submit-btn" id="createRoomBtn">ساخت و ورود به اتاق</button>
      </div>
      <div class="login-error" id="roomsError"></div>
    </div>
  </div>

  <!-- ============ ROOM PASSWORD SCREEN ============ -->
  <div id="roomPasswordScreen" style="display:none;">
    <div class="login-card">
      <h1>🔒 اتاق قفل‌شده</h1>
      <p id="roomPasswordName"></p>
      <input id="roomPasswordCheckInput" type="text" placeholder="پسورد اتاق" maxlength="30" autocomplete="off">
      <button class="submit-btn" id="roomPasswordSubmitBtn">ورود به اتاق</button>
      <button class="submit-btn" id="roomPasswordBackBtn" style="background:rgba(255,255,255,0.08); margin-top:10px;">بازگشت</button>
      <div class="login-error" id="roomPasswordError"></div>
    </div>
  </div>

  <!-- ============ LOGIN SCREEN ============ -->
  <div id="loginScreen" style="display:none;">
    <div class="login-card">
      <h1>💬 چت‌روم</h1>
      <p>برای ورود به چت، اطلاعاتت رو کامل کن</p>
      <input id="nameInput" type="text" placeholder="اسم" maxlength="20" autocomplete="off">
      <input id="phoneInput" type="tel" placeholder="شماره موبایل" maxlength="15" autocomplete="off">
      <input id="ageInput" type="number" placeholder="سن" min="1" max="120" autocomplete="off">
      <input id="cityInput" type="text" placeholder="شهر" maxlength="30" autocomplete="off">
      <div class="gender-row">
        <button type="button" class="gender-btn" id="genderBoy">پسر</button>
        <button type="button" class="gender-btn" id="genderGirl">دختر</button>
      </div>
      <button class="submit-btn" id="joinBtn">ورود به چت</button>
      <div class="login-error" id="loginError"></div>

      <div class="install-banner">
        <p>برای داشتن همیشگی چت روی گوشیت، برنامه رو نصب کن:</p>
        <a href="https://chatdan.danyalcode.ir/" target="_blank" rel="noopener">نصب اپلیکیشن</a>
      </div>
    </div>
  </div>

  <!-- ============ CHAT SCREEN ============ -->
  <div id="chatScreen">
    <header class="topbar">
      <div class="brand"><span class="dot"></span> چت‌روم زنده</div>
      <div id="onlineList"></div>
    </header>

    <main class="chat-area" id="chatArea"></main>

    <footer class="composer">
      <input id="msgInput" type="text" placeholder="پیامت رو بنویس..." autocomplete="off" enterkeyhint="send">
      <input id="imgFileInput" type="file" accept="image/*" style="display:none">
      <button id="imgBtn" class="img-btn" type="button">📷</button>
      <button id="micBtn" class="mic-btn" type="button">🎤</button>
      <button id="sendBtn">ارسال</button>
    </footer>
  </div>

</div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <img id="lightboxImg" src="">
</div>

<div class="recording-indicator" id="recordingIndicator">
  <span class="rec-dot"></span>
  <span id="recordingTimer">۰:۰۰</span> در حال ضبط... رها کن برای ارسال
</div>

<!-- ============ PROFILE MODAL ============ -->
<div class="modal-overlay" id="profileModal">
  <div class="modal-card">
    <div class="avatar big" id="modalAvatar"></div>
    <h2 id="modalName"></h2>
    <div class="gender-tag" id="modalGender"></div>
    <div class="modal-info-row"><span>شماره</span><span id="modalPhone"></span></div>
    <div class="modal-info-row"><span>سن</span><span id="modalAge"></span></div>
    <div class="modal-info-row"><span>شهر</span><span id="modalCity"></span></div>
    <button class="modal-close" id="modalCloseBtn">بستن</button>
  </div>
</div>

<script>
/* =======================================================================
   1) پیکربندی Supabase
   ======================================================================= */
const SUPABASE_URL = "https://uukodwdxrckhpqgrtiir.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8zXNILcWmGFXOGZ5F6SgvA_Z7rYWfCA";

const isConfigured = !SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_ANON_KEY.startsWith("YOUR_");
const supabaseClient = isConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* =======================================================================
   2) متغیرهای عمومی
   ======================================================================= */
const MAX_MESSAGES = 200;
let selectedRoom = null; // { id, name, slug, password }
let myProfile = null; // { name, phone, age, city, gender }
let presenceChannel = null;
const colors = ["#7f5af0","#2cb67d","#ff6b6b","#f5a623","#4fb0ff","#e356a7","#37c9c1","#c084fc"];

function colorFor(name){
  let hash = 0;
  for (let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return colors[Math.abs(hash) % colors.length];
}
function initials(name){
  return (name || '').trim().charAt(0).toUpperCase();
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str || '';
  return d.innerHTML;
}
function formatTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
}

/* =======================================================================
   2b) صفحه‌ی اتاق‌ها
   ======================================================================= */
const roomsScreen = document.getElementById('roomsScreen');
const roomsList = document.getElementById('roomsList');
const roomsError = document.getElementById('roomsError');
const showCreateRoomBtn = document.getElementById('showCreateRoomBtn');
const createRoomForm = document.getElementById('createRoomForm');
const roomNameInput = document.getElementById('roomNameInput');
const roomPasswordInput = document.getElementById('roomPasswordInput');
const createRoomBtn = document.getElementById('createRoomBtn');

const roomPasswordScreen = document.getElementById('roomPasswordScreen');
const roomPasswordName = document.getElementById('roomPasswordName');
const roomPasswordCheckInput = document.getElementById('roomPasswordCheckInput');
const roomPasswordSubmitBtn = document.getElementById('roomPasswordSubmitBtn');
const roomPasswordBackBtn = document.getElementById('roomPasswordBackBtn');
const roomPasswordError = document.getElementById('roomPasswordError');

let pendingRoom = null;

async function loadRooms(){
  roomsError.textContent = '';
  const { data, error } = await supabaseClient
    .from('rooms')
    .select('*')
    .order('created_at', { ascending: false });

  roomsList.innerHTML = '';
  if (error || !data || !data.length){
    roomsList.innerHTML = '<div class="no-rooms-msg">هنوز اتاقی ساخته نشده. اولین نفر باش!</div>';
    return;
  }

  data.forEach(room => {
    const item = document.createElement('div');
    item.className = 'room-item';
    item.innerHTML = `
      <span class="room-name">${escapeHtml(room.name)}</span>
      <span class="room-lock">${room.password ? '🔒' : ''}</span>
    `;
    item.addEventListener('click', () => selectRoom(room));
    roomsList.appendChild(item);
  });
}

function selectRoom(room){
  if (room.password){
    pendingRoom = room;
    roomPasswordName.textContent = 'اتاق «' + room.name + '»';
    roomPasswordCheckInput.value = '';
    roomPasswordError.textContent = '';
    roomsScreen.style.display = 'none';
    roomPasswordScreen.style.display = 'flex';
  } else {
    enterRoom(room);
  }
}

function enterRoom(room){
  selectedRoom = room;
  roomsScreen.style.display = 'none';
  roomPasswordScreen.style.display = 'none';
  loginScreen.style.display = 'flex';
}

roomPasswordSubmitBtn.addEventListener('click', () => {
  if (!pendingRoom) return;
  if (roomPasswordCheckInput.value === pendingRoom.password){
    enterRoom(pendingRoom);
  } else {
    roomPasswordError.textContent = 'پسورد اشتباهه.';
  }
});
roomPasswordCheckInput.addEventListener('keydown', e => { if (e.key === 'Enter') roomPasswordSubmitBtn.click(); });
roomPasswordBackBtn.addEventListener('click', () => {
  roomPasswordScreen.style.display = 'none';
  roomsScreen.style.display = 'flex';
});

showCreateRoomBtn.addEventListener('click', () => {
  createRoomForm.style.display = createRoomForm.style.display === 'none' ? 'block' : 'none';
});

createRoomBtn.addEventListener('click', async () => {
  const name = roomNameInput.value.trim();
  const password = roomPasswordInput.value.trim();
  roomsError.textContent = '';

  if (!name){
    roomsError.textContent = 'اسم اتاق رو وارد کن.';
    return;
  }
  if (!/^[A-Za-z0-9 _-]+$/.test(name)){
    roomsError.textContent = 'اسم اتاق فقط باید انگلیسی باشه (حروف، عدد، فاصله، - و _).';
    return;
  }

  const slug = name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();

  const { data, error } = await supabaseClient
    .from('rooms')
    .insert({ name, slug, password: password || null })
    .select()
    .single();

  if (error || !data){
    roomsError.textContent = 'ساخت اتاق ناموفق بود.';
    return;
  }

  roomNameInput.value = '';
  roomPasswordInput.value = '';
  createRoomForm.style.display = 'none';
  enterRoom(data);
});

loadRooms();

/* =======================================================================
   3) ورود کاربر
   ======================================================================= */
const loginScreen = document.getElementById('loginScreen');
const chatScreen = document.getElementById('chatScreen');
const nameInput = document.getElementById('nameInput');
const phoneInput = document.getElementById('phoneInput');
const ageInput = document.getElementById('ageInput');
const cityInput = document.getElementById('cityInput');
const genderBoyBtn = document.getElementById('genderBoy');
const genderGirlBtn = document.getElementById('genderGirl');
const joinBtn = document.getElementById('joinBtn');
const loginError = document.getElementById('loginError');

let selectedGender = null;
genderBoyBtn.addEventListener('click', () => {
  selectedGender = 'پسر';
  genderBoyBtn.classList.add('selected');
  genderGirlBtn.classList.remove('selected');
});
genderGirlBtn.addEventListener('click', () => {
  selectedGender = 'دختر';
  genderGirlBtn.classList.add('selected');
  genderBoyBtn.classList.remove('selected');
});

joinBtn.addEventListener('click', joinChat);
[nameInput, phoneInput, ageInput, cityInput].forEach(inp => {
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') joinChat(); });
});

function joinChat(){
  if (!isConfigured){
    loginError.textContent = "ابتدا تنظیمات Supabase را در فایل انجام بده.";
    return;
  }
  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  const age = ageInput.value.trim();
  const city = cityInput.value.trim();

  if (!name || !phone || !age || !city || !selectedGender){
    loginError.textContent = "لطفاً همه‌ی فیلدها رو پر کن و جنسیت رو انتخاب کن.";
    return;
  }
  loginError.textContent = "";
  myProfile = { name, phone, age, city, gender: selectedGender };

  const userKey = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2);

  presenceChannel = supabaseClient.channel('room-' + selectedRoom.id, { config: { presence: { key: userKey } } });

  presenceChannel
    .on('presence', { event: 'sync' }, () => updateOnlineList())
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED'){
        const state = presenceChannel.presenceState();
        const currentCount = Object.keys(state).length;
        if (currentCount === 0){
          await supabaseClient.from('messages').delete().eq('room_id', selectedRoom.id);
        }
        await presenceChannel.track(myProfile);
        startChat();
      }
    });
}

/* =======================================================================
   4) شروع چت
   ======================================================================= */
const onlineList = document.getElementById('onlineList');
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

async function startChat(){
  loginScreen.style.display = 'none';
  chatScreen.style.display = 'flex';

  const roomNameEl = document.querySelector('.brand');
  if (roomNameEl) roomNameEl.innerHTML = '<span class="dot"></span> ' + escapeHtml(selectedRoom.name);

  const { data: existing } = await supabaseClient
    .from('messages')
    .select('*')
    .eq('room_id', selectedRoom.id)
    .order('created_at', { ascending: true });

  chatArea.innerHTML = '';
  (existing || []).forEach(renderMessage);
  chatArea.scrollTop = chatArea.scrollHeight;

  supabaseClient.channel('messages-changes-' + selectedRoom.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room_id=eq.' + selectedRoom.id }, payload => {
      renderMessage(payload.new);
      chatArea.scrollTop = chatArea.scrollHeight;
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages', filter: 'room_id=eq.' + selectedRoom.id }, payload => {
      const el = chatArea.querySelector(`[data-id="${payload.old.id}"]`);
      if (el) el.remove();
    })
    .subscribe();

  window.addEventListener('beforeunload', () => {
    if (presenceChannel) presenceChannel.untrack();
  });

  setupMobileKeyboardFix();
}

function updateOnlineList(){
  const state = presenceChannel.presenceState();
  onlineList.innerHTML = '';
  Object.values(state).forEach(presences => {
    presences.forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'user-chip';
      chip.innerHTML = `
        <span class="avatar" style="background:${colorFor(p.name)}">${initials(p.name)}</span>
        <span>${escapeHtml(p.name)}</span>
        <span class="status-dot"></span>
      `;
      chip.addEventListener('click', () => showProfile(p));
      onlineList.appendChild(chip);
    });
  });
}

function renderMessage(msg){
  const row = document.createElement('div');
  const mine = myProfile && msg.name === myProfile.name;
  row.className = 'msg-row ' + (mine ? 'me' : 'other');
  row.dataset.id = msg.id;

  const profileData = { name: msg.name, phone: msg.phone, age: msg.age, city: msg.city, gender: msg.gender };

  const bubbleContent = msg.audio_path
    ? `<div class="voice-msg"><audio controls preload="none" src="${escapeHtml(msg.audio_path)}"></audio></div>`
    : msg.image_path
    ? `<img class="chat-img" src="${escapeHtml(msg.image_path)}" loading="lazy">`
    : escapeHtml(msg.text);

  row.innerHTML = `
    <span class="avatar" style="background:${colorFor(msg.name)}">${initials(msg.name)}</span>
    <div>
      <div class="msg-meta">${!mine ? escapeHtml(msg.name) : ''}<span>${formatTime(msg.created_at)}</span></div>
      <div class="msg-bubble">${bubbleContent}</div>
    </div>
  `;

  row.querySelector('.avatar').addEventListener('click', () => showProfile(profileData));
  const metaEl = row.querySelector('.msg-meta');
  if (metaEl) metaEl.addEventListener('click', () => showProfile(profileData));

  const imgEl = row.querySelector('.chat-img');
  if (imgEl){
    imgEl.addEventListener('click', () => {
      lightboxImg.src = msg.image_path;
      lightboxOverlay.classList.add('open');
    });
  }

  chatArea.appendChild(row);
}

/* =======================================================================
   5) ارسال پیام + محدودیت ۲۰۰ پیام
   ======================================================================= */
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

async function sendMessage(){
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';

  await supabaseClient.from('messages').insert({
    name: myProfile.name,
    text: text,
    phone: myProfile.phone,
    age: myProfile.age,
    city: myProfile.city,
    gender: myProfile.gender,
    room_id: selectedRoom.id
  });
  trimOldMessages();
}

async function trimOldMessages(){
  const { data, count } = await supabaseClient
    .from('messages')
    .select('id', { count: 'exact' })
    .eq('room_id', selectedRoom.id)
    .order('created_at', { ascending: true });

  if (count && count > MAX_MESSAGES){
    const excess = count - MAX_MESSAGES;
    const idsToDelete = data.slice(0, excess).map(row => row.id);
    if (idsToDelete.length){
      await supabaseClient.from('messages').delete().in('id', idsToDelete);
    }
  }
}

/* =======================================================================
   5b) ضبط و ارسال پیام صوتی
   ======================================================================= */
const micBtn = document.getElementById('micBtn');
const recordingIndicator = document.getElementById('recordingIndicator');
const recordingTimer = document.getElementById('recordingTimer');

let mediaRecorder = null;
let recordedChunks = [];
let recordStartTime = 0;
let recordTimerInterval = null;
let recordCancelled = false;
const MAX_RECORD_SECONDS = 60;

async function startRecording(){
  if (mediaRecorder) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    recordCancelled = false;

    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);

    mediaRecorder.addEventListener('dataavailable', e => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    });

    mediaRecorder.addEventListener('stop', () => {
      stream.getTracks().forEach(t => t.stop());
      if (!recordCancelled && recordedChunks.length){
        uploadVoiceMessage(new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' }));
      }
      mediaRecorder = null;
    });

    mediaRecorder.start();
    recordStartTime = Date.now();
    micBtn.classList.add('recording');
    recordingIndicator.classList.add('show');
    recordTimerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
      const m = Math.floor(elapsed / 60);
      const s = elapsed % 60;
      recordingTimer.textContent = m + ':' + String(s).padStart(2, '0');
      if (elapsed >= MAX_RECORD_SECONDS) stopRecording(false);
    }, 200);
  }catch(err){
    alert('اجازه‌ی دسترسی به میکروفون داده نشد.');
  }
}

function stopRecording(cancelled){
  if (!mediaRecorder) return;
  recordCancelled = !!cancelled;
  clearInterval(recordTimerInterval);
  micBtn.classList.remove('recording');
  recordingIndicator.classList.remove('show');
  recordingTimer.textContent = '۰:۰۰';
  if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

async function uploadVoiceMessage(blob){
  const fileName = 'voice_' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.webm';

  const { error: uploadError } = await supabaseClient.storage
    .from('voice')
    .upload(fileName, blob, { contentType: blob.type || 'audio/webm' });

  if (uploadError){
    alert('ارسال پیام صوتی ناموفق بود.');
    return;
  }

  const { data: urlData } = supabaseClient.storage.from('voice').getPublicUrl(fileName);

  await supabaseClient.from('messages').insert({
    name: myProfile.name,
    text: '',
    phone: myProfile.phone,
    age: myProfile.age,
    city: myProfile.city,
    gender: myProfile.gender,
    audio_path: urlData.publicUrl,
    room_id: selectedRoom.id
  });
  trimOldMessages();
}

// دسکتاپ: نگه‌داشتن با ماوس
micBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startRecording(); });
micBtn.addEventListener('mouseup', () => stopRecording(false));
micBtn.addEventListener('mouseleave', () => { if (mediaRecorder) stopRecording(false); });

// موبایل: نگه‌داشتن با لمس
micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); }, { passive:false });
micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(false); });
micBtn.addEventListener('touchcancel', () => stopRecording(true));

/* =======================================================================
   5c) ارسال عکس
   ======================================================================= */
const imgBtn = document.getElementById('imgBtn');
const imgFileInput = document.getElementById('imgFileInput');
const lightboxOverlay = document.getElementById('lightboxOverlay');

imgBtn.addEventListener('click', () => imgFileInput.click());

imgFileInput.addEventListener('change', async () => {

  if (!file) return;

  imgBtn.disabled = true;
  imgBtn.textContent = '⏳';

  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const fileName = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;

    const { error: uploadError } = await supabaseClient.storage
      .from('images')
      .upload(fileName, file, { contentType: file.type || 'image/jpeg' });

    if (uploadError){
      alert('ارسال عکس ناموفق بود.');
      return;
    }

    const { data: urlData } = supabaseClient.storage.from('images').getPublicUrl(fileName);

    await supabaseClient.from('messages').insert({
      name: myProfile.name,
      text: '',
      phone: myProfile.phone,
      age: myProfile.age,
      city: myProfile.city,
      gender: myProfile.gender,
      image_path: urlData.publicUrl,
      room_id: selectedRoom.id
    });
    trimOldMessages();
  } finally {
    imgBtn.disabled = false;
    imgBtn.textContent = '📷';
  }
});

lightboxOverlay.addEventListener('click', () => lightboxOverlay.classList.remove('open'));

/* =======================================================================
   7) رفع مشکل کیبورد موبایل
   ======================================================================= */
function setupMobileKeyboardFix(){
  const appEl = document.getElementById('app');
  const frameTop = 14;   // matches --frame
  const frameBottom = 44; // matches --frame-bottom

  function adjustLayout(){
    if (window.visualViewport){
      const vv = window.visualViewport;
      appEl.style.top = (vv.offsetTop + frameTop) + 'px';
      appEl.style.bottom = 'auto';
      appEl.style.height = Math.max(200, vv.height - frameTop - frameBottom) + 'px';
    }
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', adjustLayout);
    window.visualViewport.addEventListener('scroll', adjustLayout);
  }
  window.addEventListener('resize', adjustLayout);
  msgInput.addEventListener('focus', () => {
    setTimeout(adjustLayout, 50);
    setTimeout(adjustLayout, 300);
    setTimeout(adjustLayout, 600);
  });
  msgInput.addEventListener('blur', () => setTimeout(adjustLayout, 300));

  adjustLayout();
}
